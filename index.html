<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171411">
  <title>WebLuxe Foods — Kitchen &amp; Takeaway · Grand Baie</title>
  <meta name="description" content="Crisp starters, smashed burgers, wok noodles and desserts in Grand Baie. Order ahead with Q-Skip and collect without the queue.">
  <meta name="color-scheme" content="light">
  <meta property="og:type" content="website">
  <meta property="og:title" content="WebLuxe Foods — Kitchen &amp; Takeaway">
  <meta property="og:description" content="Order ahead with Q-Skip and collect without the queue. Burgers, wok noodles, crisp starters and desserts in Grand Baie.">
  <meta property="og:image" content="https://webluxe.github.io/webluxe-foods/img/share.jpg">
  <meta property="og:url" content="https://webluxe.github.io/webluxe-foods/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="img/mark.svg">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" type="image/webp" href="img/hero-burger-sm.webp" imagesrcset="img/hero-burger-sm.webp 820w, img/hero-burger-md.webp 1080w, img/hero-burger.webp 1600w" imagesizes="100vw" fetchpriority="high">
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="modulepreload" href="js/stage.min.js">
</head>
<body data-view="home" class="is-loading">

  <!-- Solid ink until the WebGL stage draws its first frame (and the fallback if WebGL is unavailable) -->
  <div class="veil" id="veil" aria-hidden="true"></div>
  <!-- WebGL stage: wok-fire intro and the burn transitions between tabs -->
  <canvas class="stage" id="stage" aria-hidden="true"></canvas>

  <!-- Intro wordmark (sits above the stage) -->
  <div class="intro" id="intro" role="status" aria-live="polite" aria-label="Loading WebLuxe Foods">
    <p class="intro__tag"><span>Kitchen &amp; Takeaway</span><i></i><span>Grand Baie</span></p>
    <h1 class="intro__word" aria-label="WebLuxe Foods">
      <span class="intro__w1" aria-hidden="true"><b>W</b><b>E</b><b>B</b><b>L</b><b>U</b><b>X</b><b>E</b></span>
      <span class="intro__w2" aria-hidden="true"><b>F</b><b>O</b><b>O</b><b>D</b><b>S</b></span>
    </h1>
    <div class="intro__load"><span id="introMsg">Setting the table…</span><i class="intro__bar"><i id="introBar"></i></i><b id="introPct">00</b></div>
    <span class="intro__skip" aria-hidden="true">Tap to skip</span>
  </div>

  <!-- Tab transition label -->
  <div class="pt" id="pt" aria-hidden="true"><em class="pt__sub" id="ptSub"></em><b class="pt__name" id="ptName"></b></div>

  <div class="progress" id="progress" aria-hidden="true"></div>
  <header class="site-header" id="header"></header>
  <main id="view" tabindex="-1"></main>
  <footer class="site-footer" id="footer"></footer>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

  <!-- Item customiser -->
  <dialog class="sheet" id="sheet" aria-label="Customise item"></dialog>
  <!-- Cart + checkout -->
  <dialog class="drawer" id="cart" aria-label="Your order"></dialog>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay__box">
      <div class="flame-spin" aria-hidden="true"><img src="img/mark.svg" alt="" width="56" height="56"></div>
      <h3 id="ovTitle">Sending to the kitchen…</h3>
      <p id="ovMsg">Hold tight, we're printing your ticket.</p>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <noscript><p style="padding:40px;font-family:sans-serif">WebLuxe Foods needs JavaScript to take your order.</p></noscript>

  <!-- Built files: run `npm run build` after editing js/app.js, js/fx.js, js/stage.js or scss/. js/data.js is used as-is. -->
  <script defer src="js/data.js"></script>
  <script defer src="js/app.min.js"></script>
  <script type="module" src="js/stage.min.js"></script>
</body>
</html>
