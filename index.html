<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14100d">
  <title>WebLuxe Foods — Mauritian Street Kitchen · Q-Skip Takeaway</title>
  <meta name="description" content="Mine frite, dholl puri, briani and more. Order ahead with Q-Skip, skip the queue and collect your Mauritian takeaway hot.">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="img/coin-spin.webp" type="image/webp">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-view="home" class="is-loading">

  <!-- Intro: particle wordmark (canvas) + spinning 3D medallion -->
  <div class="loader" id="loader" role="status" aria-live="polite" aria-label="Loading WebLuxe Foods">
    <canvas class="loader__fx" id="loaderFx" aria-hidden="true"></canvas>
    <div class="loader__top"><div class="coin coin--xl" aria-hidden="true"></div></div>
    <div class="loader__bottom">
      <p class="loader__msg" id="loaderMsg">Pe sof lapoel…</p>
      <div class="loader__bar"><i id="loaderBar"></i></div>
      <div class="loader__pct"><span id="loaderPct">0</span>%</div>
    </div>
  </div>

  <!-- Tab transition: ink expands from where you tapped -->
  <div class="wipe" id="wipe" aria-hidden="true"><i class="wipe__a"></i><i class="wipe__b"></i><div class="coin"></div></div>

  <div class="progress" id="progress" aria-hidden="true"></div>
  <header class="site-header" id="header"></header>
  <main id="view" tabindex="-1"></main>
  <footer class="site-footer" id="footer"></footer>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

  <!-- Item customiser -->
  <dialog class="sheet" id="sheet" aria-label="Customise item"></dialog>
  <!-- Cart + checkout -->
  <dialog class="drawer" id="cart" aria-label="Your order"></dialog>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay__box">
      <div class="coin coin--lg" aria-hidden="true"></div>
      <h3 id="ovTitle">Sending to the kitchen…</h3>
      <p id="ovMsg">Hold tight, we're printing your ticket.</p>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <noscript><p style="padding:40px;font-family:sans-serif">WebLuxe Foods needs JavaScript to take your order.</p></noscript>

  <script src="js/vendor/qrcode.js"></script>
  <script src="js/data.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
