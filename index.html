<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15110e">
  <title>Kot Nou — Mauritian Street Kitchen · Q-Skip Takeaway</title>
  <meta name="description" content="Mine frite, dholl puri, briani and more — order ahead with Q-Skip, skip the queue and collect your Mauritian takeaway hot.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315110e'/%3E%3Cg transform='skewX(-14) translate(6 0)'%3E%3Crect x='5' y='7' width='4' height='18' fill='%23e4002b'/%3E%3Crect x='10' y='7' width='4' height='18' fill='%231b2a8f'/%3E%3Crect x='15' y='7' width='4' height='18' fill='%23ffd200'/%3E%3Crect x='20' y='7' width='4' height='18' fill='%2300a04a'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-view="home" class="is-loading">

  <!-- Intro loading screen -->
  <div class="loader" id="loader" role="status" aria-live="polite">
    <canvas class="loader__fx" id="loaderFx" aria-hidden="true"></canvas>
    <div class="loader__in">
      <div class="logo logo--xl"><span class="logo__mark"><i></i><i></i><i></i><i></i></span><span class="logo__text">KOT NOU</span></div>
      <p class="loader__msg" id="loaderMsg">Pe sof lapoel…</p>
      <div class="loader__bar"><i id="loaderBar"></i></div>
      <div class="loader__pct"><span id="loaderPct">0</span>%</div>
    </div>
  </div>

  <!-- Tab transition curtain -->
  <div class="curtain" id="curtain" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <header class="site-header" id="header"></header>
  <main id="view" tabindex="-1"></main>
  <footer class="site-footer" id="footer"></footer>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

  <!-- Item customiser -->
  <dialog class="sheet" id="sheet" aria-label="Customise item"></dialog>
  <!-- Cart + checkout -->
  <dialog class="drawer" id="cart" aria-label="Your order"></dialog>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay__box">
      <div class="overlay__spin"><span class="logo__mark"><i></i><i></i><i></i><i></i></span></div>
      <h3 id="ovTitle">Sending to the kitchen…</h3>
      <p id="ovMsg">Hold tight, we're printing your ticket.</p>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <noscript><p style="padding:40px;font-family:sans-serif">Kot Nou needs JavaScript to take your order.</p></noscript>

  <script src="js/vendor/qrcode.js"></script>
  <script src="js/data.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
